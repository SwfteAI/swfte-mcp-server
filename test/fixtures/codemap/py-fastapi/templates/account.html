{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}

{% endblock %}
{% block chat %}
<script src="https://unpkg.com/@swfte/chat-widget@1.4.0/dist/swfte-chat.umd.js"></script>

    agentId: "{{ support_agent }}",

{% endblock %}

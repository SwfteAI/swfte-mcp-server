[project]
name = "acme-ops"
version = "0.9.2"
description = "Acme operations portal: lead scoring, contract review, helpdesk and billing on Swfte."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "jinja2>=3.1",
    "httpx>=0.27",
    "requests>=2.32",
    "swfte-sdk>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

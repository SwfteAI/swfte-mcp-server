<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme translator</title>
  </head>
  <body>
    <h1>Translate a help article</h1>
<!-- Swfte agent chat: agent:ag_Pub8Nq. Public endpoint + publishable embed key (swfte_pk_, this agent only, origin allow-listed). -->
<div id="swfte-agent-ag_Pub8Nq" class="swfte-agent-chat" style="font:14px/1.4 system-ui,sans-serif;max-width:420px;border:1px solid #ccc;border-radius:8px;padding:8px">
  <div data-log style="max-height:320px;overflow:auto;margin-bottom:8px" aria-live="polite"></div>
  <form data-form style="display:flex;gap:6px">
    <input data-input name="message" autocomplete="off" required maxlength="4000" placeholder="Ask Acme translator…" style="flex:1;padding:6px">
    <button type="submit">Send</button>
  </form>
</div>
<script>
(function () {
  var cfg = {"endpoint":"https://api.swfte.com/agents/v1/public/agents/ag_Pub8Nq/chat","key":"swfte_pk_fixtureonly","root":"swfte-agent-ag_Pub8Nq","name":"Acme translator"};
  var root = document.getElementById(cfg.root);
  if (!root) return;
  var log = root.querySelector('[data-log]'), form = root.querySelector('[data-form]'), input = root.querySelector('[data-input]');
  var visitor;
  try { visitor = localStorage.getItem('swfte-visitor'); } catch (e) {}
  if (!visitor) {
    visitor = 'v' + Math.random().toString(36).slice(2, 14);
    try { localStorage.setItem('swfte-visitor', visitor); } catch (e) {}
  }
  function add(who, text) {
    var p = document.createElement('p');
    p.style.margin = '4px 0';
    var b = document.createElement('strong');
    b.textContent = who + ': ';
    p.appendChild(b);
    p.appendChild(document.createTextNode(text));
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var message = input.value.trim();
    if (!message) return;
    input.value = '';
    add('You', message);
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Swfte-Embed-Key': cfg.key },
      body: JSON.stringify({ message: message, visitorId: visitor })
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      var reply = res.body && (res.body.content != null ? res.body.content : res.body.response);
      add(cfg.name, res.ok && typeof reply === 'string' ? reply : 'Sorry, no answer right now.');
    }).catch(function () { add(cfg.name, 'Sorry, no answer right now.'); });
  });
})();
</script>
  </body>
</html>

name: Release

# Tag-based releases require manual approval before any publish runs.
# Each publish job is gated by a GitHub Environment with required reviewers
# (configured under Settings → Environments). Without that approval, the job
# pauses indefinitely and nothing is pushed to npm or Docker Hub.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm an intentional release'
        required: true

# Read-only by default. id-token (npm provenance / trusted publishing) and packages (GHCR) are
# granted only to the one job that needs each, below.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # Publish only what is on master. A manual dispatch must run from master; a tag must
      # point at a commit master contains (otherwise any branch could be published by tagging it).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Release commit must be on master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Manual releases must be dispatched from master (got ${GITHUB_REF})"; exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/master; then
            echo "::error::${GITHUB_SHA} is not on master; refusing to publish it"; exit 1
          fi
      - name: Confirm intentional manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PUBLISH" ]; then
            echo "::error::Manual run requires confirm=PUBLISH"
            exit 1
          fi
      - run: echo "Release guard passed for ${GITHUB_REF}"

  verify:
    uses: ./.github/workflows/ci.yml

  npm-publish:
    runs-on: ubuntu-latest
    needs: [guard, verify]
    # id-token: write lets npm mint a short-lived OIDC credential for provenance and, once the
    # package is configured for trusted publishing on npmjs.com, for the publish itself.
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-publish-prod
      url: https://www.npmjs.com/package/@swfte/mcp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@11
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          # Bypass the local-publish paranoia guard in package.json's
          # prepublishOnly. This step only runs after the npm-publish-prod
          # environment-approval gate, so a human has confirmed intent.
          SWFTE_PUBLISH_CONFIRMED: '1'
          # ENVIRONMENT secret (npm-publish-prod), not a repository secret: only this job, after the
          # reviewer gate, can read it. Delete it once trusted publishing is configured for the
          # package (npmjs.com -> package -> Settings -> Trusted publisher: SwfteAI/swfte-mcp-server,
          # release.yml, environment npm-publish-prod); npm then authenticates by OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-publish:
    runs-on: ubuntu-latest
    needs: npm-publish
    permissions:
      contents: read
      packages: write
    environment:
      name: docker-publish-prod
      url: https://hub.docker.com/r/swfte/mcp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: meta
        run: |
          # On a tag push the ref names the version. On workflow_dispatch (an operator, or
          # release-on-merge.yml) GITHUB_REF is refs/heads/master, and the old expression yielded
          # VERSION="refs/heads/master" — an invalid Docker tag, so the manual path was broken
          # after the npm publish had already happened. package.json is the source of truth on
          # every path; the tag, when present, must agree with it.
          VERSION=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              if [ "${TAG#v}" != "$VERSION" ]; then
                echo "::error::tag $TAG does not match package.json version $VERSION"; exit 1
              fi ;;
            *) TAG="v$VERSION" ;;
          esac
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            swfte/mcp-server:latest
            swfte/mcp-server:${{ steps.meta.outputs.version }}
            ghcr.io/swfteai/swfte-mcp-server:latest
            ghcr.io/swfteai/swfte-mcp-server:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=Swfte MCP Server
            org.opencontainers.image.description=Official Model Context Protocol server for the Swfte AI platform.
            org.opencontainers.image.url=https://www.swfte.com
            org.opencontainers.image.source=https://github.com/SwfteAI/swfte-mcp-server
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Swfte, Inc.
          provenance: false
